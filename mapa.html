<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de la ruta · Los de las Claras</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
/* Mapa para incrustar en blogs y webs (iframe). Direcciones que entiende:
   mapa.html#r-<ruta del blog>   → datos en mapa/<ruta>.json (los genera el robot)
   mapa.html#co-<colaborador>-<ruta> → ruta de un colaborador, en mapa/co-….json
   mapa.html#c=<código>          → track de «Mis cosas» guardado en la nube (enlace corto de Compartir)
   mapa.html#t3=<polilínea>!<nombre> → track con todo dentro (sin cuenta) */
:root{--ink:#1f2a24;--muted:#5f6b62;--card:#fff;--edge:#d4d8cf;--mark:#c3262e;--paper:#eef0ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--card);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#w{display:flex;flex-direction:column;height:100%;border:1px solid var(--edge);border-radius:12px;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--edge)}
header img{width:30px;height:30px;border-radius:7px;flex:none}
header .tt{min-width:0;flex:1}
header b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header span{color:var(--muted);font-size:12.5px}
#map{flex:1;min-height:180px;background:var(--paper);position:relative}
#pf{height:84px;border-top:1px solid var(--edge);position:relative;touch-action:none;cursor:crosshair}
#pf svg{display:block;width:100%;height:100%}
#pi{position:absolute;top:4px;left:8px;font-size:12px;color:var(--muted);pointer-events:none}
footer{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--edge);align-items:center}
.b{flex:1;text-align:center;text-decoration:none;font-weight:700;border-radius:10px;padding:9px 6px;font-size:14px}
.b1{background:var(--mark);color:#fff}
.b2{border:1px solid var(--edge);color:var(--ink)}
.leaflet-control-attribution{font-size:9px}
.cap{position:absolute;z-index:500;inset:auto 0 8px 0;text-align:center;pointer-events:none}
.cap span{background:rgba(31,42,36,.78);color:#fff;font-size:12px;padding:4px 10px;border-radius:20px;opacity:0;transition:opacity .25s}
.cap span.on{opacity:1}
.err{padding:24px;text-align:center;color:var(--muted)}
.wp{font-size:18px;line-height:18px;text-shadow:0 0 3px #fff,0 0 3px #fff}
</style></head><body>
<div id="w">
  <header><img src="icons/icon-192.png" alt="">
    <div class="tt"><b id="t">Cargando…</b><span id="s"></span></div></header>
  <div id="map"><div class="cap"><span id="cap">Usa dos dedos o Ctrl + rueda para mover el mapa</span></div></div>
  <div id="pf" hidden><div id="pi"></div><svg id="sv" preserveAspectRatio="none"></svg></div>
  <footer>
    <a class="b b1" id="app" target="_blank" rel="noopener">⛰️ Seguir en la app</a>
    <a class="b b2" id="gpx" href="#">⬇ Descargar GPX</a>
  </footer>
</div>
<script src="vendor/leaflet.js"></script>
<script type="module">
const APP="https://losdelasclaras.github.io/rutas/";
const $=id=>document.getElementById(id);
const nf=n=>Math.round(n).toLocaleString("es-ES");
const xe=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function dec(s,dim){const out=[];let i=0;const v=new Array(dim).fill(0);const d=()=>{let r=0,sh=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&0x1f)<<sh;sh+=5}while(b>=0x20&&i<=s.length);return r&1?~(r>>1):r>>1};
  while(i<s.length){for(let k=0;k<dim;k++)v[k]+=d();out.push(dim===3?[v[0]/1e5,v[1]/1e5,v[2]]:[v[0]/1e5,v[1]/1e5])}return out}

/* cada tipo de dirección se convierte en lo mismo: nombre, datos de cabecera, recorrido, puntos y enlace a la app */
async function cargar(){const h=decodeURIComponent(location.hash||"");
  if(/^#(r|co)-[a-z0-9-]+$/.test(h)){const R=await (await fetch("mapa/"+h.slice(1)+".json")).json();
    const n=(R.ti||R.t).replace(/\s+/g," ").trim();
    return{n,gpxn:n,u:R.u,trk:R.trk,w:[],sal:R.sal,cima:R.a?R.t:null,up:R.de||R.up,km:R.km,tm:R.tm,dif:R.dif,quien:R.quien,app:R.app||APP+"#"+R.slug}}
  if(/^#c=[A-Za-z0-9]{4,20}$/.test(h)){const G="https://www.gstatic.com/firebasejs/10.14.1/";
    const [ap,fs]=await Promise.all([import(G+"firebase-app.js"),import(G+"firebase-firestore.js")]);
    const app=ap.initializeApp({apiKey:"AIzaSyBzYlxsZhJVPJpCk0_EgxaplD7zWMOOg1I",authDomain:"losdelasclaras-rutas.firebaseapp.com",projectId:"losdelasclaras-rutas",appId:"1:115151504481:web:9338dae56b04b4d2989620"});
    const d=await fs.getDoc(fs.doc(fs.getFirestore(app),"enlaces",h.slice(3)));if(!d.exists())throw 0;
    const v=d.data();if(v.tipo==="puntos")throw 0;let w=[];try{w=v.w?JSON.parse(v.w):[]}catch(e){}
    return{n:v.n||"Track",gpxn:v.n||"Track",trk:JSON.parse(v.d),w,up:v.up,km:v.km,app:APP+h}}
  if(h.startsWith("#t3=")){const p=h.slice(4).split("!"),n=p[1]||"Track";
    return{n,gpxn:n,trk:dec(p[0],3),w:[],app:APP+location.hash}}
  throw 0}

let R;try{R=await cargar();if(!R.trk||R.trk.length<2)throw 0}
catch(e){$("w").innerHTML='<p class="err">No encuentro este recorrido.<br><a href="'+APP+'" target="_blank" rel="noopener">Abrir la app de Los de las Claras</a></p>';throw e}

const ll=R.trk.map(p=>[p[0],p[1]]),conAlt=R.trk.every(p=>p[2]!=null);
const rad=d=>d*Math.PI/180,hv=(a,b)=>{const x=Math.sin(rad(b[0]-a[0])/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(rad(b[1]-a[1])/2)**2;return 12742*Math.asin(Math.sqrt(x))};
const D=[0];for(let i=1;i<ll.length;i++)D.push(D[i-1]+hv(ll[i-1],ll[i]));const tot=D[D.length-1];
if(R.km==null)R.km=Math.round(tot*10)/10;
if(R.up==null&&conAlt){let u=0,b=R.trk[0][2];for(const p of R.trk){if(p[2]>b+5){u+=p[2]-b;b=p[2]}else if(p[2]<b-5)b=p[2]}R.up=u}
if(!R.tm&&R.km){const a=R.km/4,b=(R.up||0)/400,hh=Math.max(a,b)+Math.min(a,b)/2;R.tm="~"+(hh<1?Math.round(hh*60)+" min":Math.round(hh)+" h")}
$("t").textContent=R.n;
$("s").textContent=[R.km&&String(R.km).replace(".",",")+" km",R.up!=null&&"+"+nf(R.up)+" m",R.tm,R.dif].filter(Boolean).join(" · ");
$("app").href=R.app;if(!R.u&&!R.quien)$("app").textContent="⛰️ Abrir en la app";
if(R.quien)$("s").textContent=R.quien+" · "+$("s").textContent;

$("gpx").addEventListener("click",e=>{e.preventDefault();
  const g='<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Los de las Claras" xmlns="http://www.topografix.com/GPX/1/1">\n<metadata><name>'+xe(R.gpxn)+'</name>'+(R.u?'<link href="'+xe(R.u)+'"/>':'')+'</metadata>\n'+
    R.w.map(q=>'<wpt lat="'+q[1]+'" lon="'+q[2]+'">'+(q[3]!=null?'<ele>'+q[3]+'</ele>':'')+'<name>'+xe(q[0])+'</name></wpt>\n').join("")+
    '<trk><name>'+xe(R.gpxn)+'</name><trkseg>'+R.trk.map(q=>'<trkpt lat="'+q[0]+'" lon="'+q[1]+'">'+(q[2]!=null?'<ele>'+q[2]+'</ele>':'')+'</trkpt>').join("")+'</trkseg></trk>\n</gpx>\n';
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([g],{type:"application/gpx+xml"}));
  a.download=R.gpxn.replace(/[\\/:*?"<>|]+/g," ").slice(0,80)+".gpx";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},60000)});

const map=L.map("map",{scrollWheelZoom:false,dragging:!L.Browser.mobile,tap:false});
L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{subdomains:"abc",maxNativeZoom:17,maxZoom:18,
  attribution:'© <a href="https://opentopomap.org" target="_blank">OpenTopoMap</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank">OSM</a> · <a href="'+APP+'" target="_blank">Los de las Claras</a>'}).addTo(map);
L.polyline(ll,{color:"#fff",weight:7,opacity:.9}).addTo(map);
const line=L.polyline(ll,{color:"#c3262e",weight:4,opacity:.95}).addTo(map);
L.circleMarker(ll[0],{radius:7,color:"#fff",weight:2,fillColor:"#3d6b4f",fillOpacity:1}).bindTooltip(R.sal?"Salida: "+R.sal.replace(" ↗",""):"Salida").addTo(map);
if(conAlt){let c=0;R.trk.forEach((p,i)=>{if(p[2]>R.trk[c][2])c=i});
  L.marker(ll[c],{icon:L.divIcon({className:"",html:'<div class="wp">▲</div>',iconSize:[18,18],iconAnchor:[9,13]})})
    .bindTooltip((R.cima||"Punto más alto")+" · "+nf(R.trk[c][2])+" m").addTo(map)}
for(const q of R.w)L.marker([q[1],q[2]],{icon:L.divIcon({className:"",html:'<div class="wp">'+(/^\p{Extended_Pictographic}/u.test(q[4]||"")?q[4]:"📍")+'</div>',iconSize:[18,18],iconAnchor:[9,16]})})
  .bindTooltip(xe(q[0])+(q[3]!=null?" · "+nf(q[3])+" m":"")).addTo(map);
map.fitBounds(line.getBounds(),{padding:[18,18]});
const dot=L.circleMarker(ll[0],{radius:6,color:"#fff",weight:2,fillColor:"#1f2a24",fillOpacity:1});

/* para no secuestrar el scroll del blog: el mapa se mueve con dos dedos o Ctrl + rueda */
const cap=$("cap");let ct;const aviso=()=>{cap.classList.add("on");clearTimeout(ct);ct=setTimeout(()=>cap.classList.remove("on"),1400)};
map.getContainer().addEventListener("wheel",e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();map.setZoomAround(map.mouseEventToContainerPoint(e),map.getZoom()+(e.deltaY<0?1:-1))}else aviso()},{passive:false});
if(L.Browser.mobile)map.getContainer().addEventListener("touchstart",e=>{if(e.touches.length>1)map.dragging.enable();else{map.dragging.disable();aviso()}},{passive:true});

/* perfil de alturas: al pasar el dedo, un punto recorre el track */
if(conAlt){$("pf").hidden=false;map.invalidateSize();map.fitBounds(line.getBounds(),{padding:[18,18]});
  const E=R.trk.map(p=>p[2]),mn=Math.min(...E),mx=Math.max(...E);
  const W=1000,H=100,X=d=>d/tot*W,Y=e=>H-6-(e-mn)/(mx-mn||1)*(H-26);
  const path=R.trk.map((p,i)=>(i?"L":"M")+X(D[i]).toFixed(1)+","+Y(p[2]).toFixed(1)).join("");
  const sv=$("sv");sv.setAttribute("viewBox",`0 0 ${W} ${H}`);
  sv.innerHTML=`<path d="${path}L${W},${H}L0,${H}Z" fill="#c3262e" fill-opacity=".14"/><path d="${path}" fill="none" stroke="#c3262e" stroke-width="2" vector-effect="non-scaling-stroke"/><line id="cur" y1="0" y2="${H}" stroke="#1f2a24" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/>`;
  const pi=$("pi"),base=nf(mn)+"–"+nf(mx)+" m · toca el perfil";pi.textContent=base;
  const en=cx=>{const r=sv.getBoundingClientRect(),d=Math.max(0,Math.min(1,(cx-r.left)/r.width))*tot;let i=D.findIndex(v=>v>=d);if(i<0)i=D.length-1;
    const c=$("cur");c.setAttribute("x1",X(D[i]));c.setAttribute("x2",X(D[i]));c.setAttribute("visibility","visible");
    dot.setLatLng(ll[i]).addTo(map);pi.textContent="km "+D[i].toFixed(1).replace(".",",")+" · "+nf(E[i])+" m"};
  const pf=$("pf");pf.addEventListener("pointermove",e=>en(e.clientX));pf.addEventListener("pointerdown",e=>en(e.clientX));
  pf.addEventListener("pointerleave",()=>{$("cur").setAttribute("visibility","hidden");dot.remove();pi.textContent=base})}
</script>
</body></html>

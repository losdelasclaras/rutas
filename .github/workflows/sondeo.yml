name: Sondeo de mapas
on:
  push: {branches: [datos], paths: ['robot/sondeo/**']}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: datos, fetch-depth: 1}
      - run: |
          mkdir out
          while read m; do [ -n "$m" ] && curl -sSL -m 120 "https://www.google.com/maps/d/kml?mid=$m&forcekml=1" -o out/$m.kml; done < robot/sondeo/mids.txt
          ls -la out
      - uses: actions/upload-artifact@v4
        with: {name: kml, path: out}

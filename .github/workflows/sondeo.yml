name: Sondeo de mapas
on:
  push: {branches: [datos], paths: ['robot/sondeo/**']}
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: datos, fetch-depth: 1}
      - run: |
          mkdir /tmp/out
          python robot/sondeo/ver.py robot/sondeo/urls.txt || true
          git config --global user.name "Robot de Los de las Claras"; git config --global user.email "losdelasclaras@users.noreply.github.com"
          git checkout --orphan sondeo3 && git rm -rqf . && cp /tmp/out/* . && git add . && git commit -qm sondeo && git push -fq origin sondeo3

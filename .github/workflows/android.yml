name: App Android
on:
  push: { branches: [android] }
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk LdC-Rutas.apk
      - name: Guardar el APK en la rama (para servirlo desde la web)
        if: "!contains(github.event.head_commit.message, '[apk]')"
        run: |
          mkdir -p apk && cp LdC-Rutas.apk apk/
          git config user.name "Los de las Claras"; git config user.email "losdelasclaras@users.noreply.github.com"
          git add -f apk/LdC-Rutas.apk && git commit -m "APK compilado ${{ github.run_number }} [apk] [skip ci]" && git push
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: App Android ${{ github.run_number }}
          files: LdC-Rutas.apk
          make_latest: true
          body: "App para Android de Los de las Claras. Descarga LdC-Rutas.apk e instálala."

<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grabar y seguir</title>
<link rel="stylesheet" href="leaflet.css">
<style>
:root{--ink:#1f2a24;--card:#fff;--muted:#5d6b62;--edge:#d9dfd9;--rojo:#c3262e;--lila:#7b2cbf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font:18px/1.4 system-ui,-apple-system,Roboto,sans-serif;background:#e8e6dc}
#map{position:fixed;inset:0;background:#e8e6dc}
.leaflet-control-attribution{font-size:10px}
/* datos arriba: dos tiras pequeñas; al tocarlas se ve todo */
#top{position:fixed;left:10px;right:10px;top:10px;z-index:1000;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
.chip{pointer-events:auto;max-width:100%;background:rgba(255,255,255,.96);border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.25);padding:7px 12px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.chip .ic{flex:none;font-size:15px;border-left:1px solid var(--edge);padding-left:8px;color:var(--muted)}
.chip .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
#rec.rec{background:var(--rojo);color:#fff}#rec.rec .ic{color:#fff;border-color:rgba(255,255,255,.4)}
#rec.pau{background:#fff1e0;color:#8a4b00}
#rec .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;margin-right:6px;animation:lat 1s ease-in-out infinite alternate}
@keyframes lat{from{opacity:1}to{opacity:.3}}
#seg{flex-direction:column;align-items:stretch;background:#f2ebfa;color:#3d1466;width:100%}
#seg .s1{display:flex;align-items:center;gap:8px}
#seg.fuera{background:#b3261e;color:#fff}#seg.fuera .ic{color:#fff}#seg.fin{background:#1f6b32;color:#fff}#seg.fin .ic{color:#fff}
#seg[hidden],#segMas[hidden]{display:none}
#segMas{margin-top:8px;font-weight:600}
.bar{height:6px;border-radius:3px;background:rgba(0,0,0,.12);overflow:hidden;margin:2px 0 8px}.bar i{display:block;height:100%;background:#7b2cbf}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 4px;text-align:center}
.g3 b{display:block;font-size:19px;font-variant-numeric:tabular-nums}.g3 small{display:block;font-size:12px;opacity:.8;font-weight:700;line-height:1.15}
.ir{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.ir button{flex:1 1 40%;border:0;border-radius:10px;padding:9px 6px;font:inherit;font-size:15px;font-weight:800;background:#7b2cbf;color:#fff}
.ir button.b{background:#fff;color:#3d1466}.ir button.x{background:#fff;color:#b3261e}
.dt{width:100%;border-collapse:collapse;margin:4px 0 8px}.dt td{padding:8px 4px;border-bottom:1px solid var(--edge);font-size:17px}.dt td+td{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
/* botones redondos a la derecha */
#lado{position:fixed;right:12px;bottom:104px;z-index:1000;display:flex;flex-direction:column;gap:12px}
.rd{width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center;font-size:20px;color:var(--ink);padding:0}
.rd small{display:block;font-size:10px;font-weight:800;margin-top:-4px}
.rd.on{background:#1a73e8;color:#fff}.rd[hidden]{display:none}
/* grabar abajo */
#abajo{position:fixed;left:0;right:0;bottom:26px;z-index:1000;display:flex;justify-content:center;align-items:center;gap:18px}
.big{width:60px;height:60px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);display:grid;place-items:center;padding:0}
.big.go{background:var(--rojo)}.big.go i{width:22px;height:22px;border-radius:50%;background:#fff}
.big.ps{background:#fff;border-color:#fff}.big.ps i{width:20px;height:22px;border-left:7px solid var(--ink);border-right:7px solid var(--ink)}
.big.pl{background:#fff}.big.pl i{width:0;height:0;border-left:20px solid var(--rojo);border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:6px}
.big.fn{background:var(--ink)}.big.fn i{width:20px;height:20px;background:#fff;border-radius:4px}
#est button{border:0;background:#20302a;color:#fff;border-radius:10px;padding:4px 10px;font-weight:800;font-size:14px;margin-left:6px}
#casa{position:fixed;left:12px;bottom:104px;z-index:1000}
.capa{display:flex;align-items:center;gap:10px;width:100%;border:2px solid var(--edge);background:#fff;border-radius:14px;padding:12px;font:inherit;font-weight:700;margin:6px 0;text-align:left}
.capa[aria-pressed=true]{border-color:#20302a;background:#eef3ee}.capa small{display:block;font-weight:500;color:var(--muted);font-size:14px}
/* hojas */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:3000}.sheet[hidden]{display:none}
.sh{background:var(--card);width:100%;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 22px}
.sh h2{margin:0 0 8px;font-size:22px}
.sh input{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid var(--edge);border-radius:12px;margin:6px 0 12px}
.b2{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:19px;font-weight:800;margin:8px 0;background:#eceeea;color:var(--ink)}
.b2.go{background:var(--rojo);color:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;z-index:2500;background:rgba(20,28,24,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:16px;font-weight:700;max-width:86%;text-align:center}
#toast[hidden]{display:none}
.me{position:relative}.me i{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;background:#1a73e8;border:4px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.wp{position:relative}.wp i{position:absolute;left:-11px;top:-28px;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#e8711a;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
</style></head><body>
<div id="map"></div>
<div id="top">
  <div id="rec" class="chip" onclick="datos()"><span class="tx" id="recTx">Toca ● para grabar</span><span class="ic" id="recIc">📊</span></div>
  <div id="seg" class="chip" hidden><div class="s1" onclick="abreSeg()"><span class="tx" id="segTx"></span><span class="ic" id="segIc">▾</span></div><div id="segMas" hidden></div></div>
</div>
<button class="rd" id="casa" onclick="Nativo.volver()" aria-label="Volver a la app">🏠</button>
<div id="lado">
  <button class="rd" id="b-bat" hidden onclick="Nativo.bateria()" aria-label="Sin límite de batería">🔋</button>
  <button class="rd" id="b-pt" onclick="nuevoPunto()" aria-label="Guardar un punto">📍</button>
  <button class="rd" id="b-capa" onclick="capas()" aria-label="Elegir el mapa">🗺</button>
  <button class="rd" id="b-me" onclick="centrar()" aria-label="Centrar en mí">◎</button>
</div>
<div id="abajo"></div>
<div id="toast" hidden></div>
<div class="sheet" id="sheet" hidden><div class="sh" id="sh"></div></div>
<script src="leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
const toR=Math.PI/180,dm=(a,b)=>{const dl=(b[0]-a[0])*toR,dn=(b[1]-a[1])*toR;const h=Math.sin(dl/2)**2+Math.cos(a[0]*toR)*Math.cos(b[0]*toR)*Math.sin(dn/2)**2;return 12742000*Math.asin(Math.min(1,Math.sqrt(h)))};
const hms=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0")};
const kmT=m=>(m/1000).toLocaleString("es-ES",{minimumFractionDigits:m<10000?2:1,maximumFractionDigits:m<10000?2:1});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={activo:false},PTS=[],D=0,YO=null,SIGUE=true,PRIM=true;
// mapa: el topográfico de la app; los trozos que se ven (y los de la zona del track) se guardan en el móvil y se ven sin cobertura
const map=L.map("map",{zoomControl:false,attributionControl:true}).setView([43.1,-5.8],9);
map.attributionControl.setPrefix(false);
const wmts=(svc,layer)=>`https://www.ign.es/wmts/${svc}?service=WMTS&request=GetTile&version=1.0.0&Format=image/jpeg&layer=${layer}&style=default&tilematrixset=GoogleMapsCompatible&TileMatrix={z}&TileRow={y}&TileCol={x}`;
const CAPAS={topo:{n:"Topográfico",d:"OpenTopoMap, curvas de nivel, de toda Europa",l:()=>L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{maxZoom:17,maxNativeZoom:17,subdomains:"abc",attribution:"© OpenTopoMap (CC-BY-SA) · © OpenStreetMap"})},
  ign:{n:"IGN · Mapa",d:"Mapa topográfico nacional, solo España",l:()=>L.tileLayer(wmts("mapa-raster","MTN"),{maxZoom:17,maxNativeZoom:17,attribution:"Mapa ráster © IGN"})},
  orto:{n:"IGN · Ortofoto",d:"Foto aérea PNOA, solo España",l:()=>L.tileLayer(wmts("pnoa-ma","OI.OrthoimageCoverage"),{maxZoom:17,maxNativeZoom:17,attribution:"Ortofoto PNOA © IGN"})}};
let CAPA="topo";try{CAPA=localStorage.getItem("capa")||"topo"}catch(e){}if(!CAPAS[CAPA])CAPA="topo";
let FONDO=CAPAS[CAPA].l().addTo(map);
// si el mapa no llega (sin cobertura y sin haberlo guardado), se dice en vez de dejar el fondo gris sin más
let MALT=0,AVT=0;const vigila=l=>{l.on("tileerror",()=>{MALT++;if(MALT>=6&&Date.now()-AVT>60000){AVT=Date.now();MALT=0;toast("🗺 Sin mapa en esta zona: no hay cobertura y no estaba guardado. Con cobertura, 🗺 › Guardar lo que se ve.",6000)}});l.on("tileload",()=>{MALT=0});return l};vigila(FONDO);
function ponCapa(k){if(!CAPAS[k])return;CAPA=k;try{localStorage.setItem("capa",k)}catch(e){}FONDO.remove();FONDO=vigila(CAPAS[k].l()).addTo(map);FONDO.bringToBack();capas()}
const mbT=b=>b<1e6?"menos de 1 MB":Math.round(b/1e6).toLocaleString("es-ES")+" MB";
function guardados(){let o={z:[],total:0};try{o=JSON.parse(Nativo.zonas())}catch(e){return""}
  const zs=o.z.slice().reverse();if(!zs.length&&o.total<1e6)return"";
  return`<h3 style="margin:16px 0 4px;font-size:18px">💾 Mapas guardados en el móvil</h3>`+zs.map(z=>`<div style="display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--edge);padding:9px 0"><span style="flex:1"><b>${esc(z.n)}</b><small style="display:block;color:var(--muted)">${(CAPAS[z.capa]||{n:z.capa}).n} · ${mbT(z.b)} · ${new Date(z.t).toLocaleDateString("es-ES",{day:"numeric",month:"short"})}</small></span><button onclick="borraZ('${z.id}')" style="border:0;background:#fde8e6;color:#b3261e;border-radius:10px;padding:9px 12px;font-weight:800;font-size:15px">🗑 Borrar</button></div>`).join("")+
    `<p style="font-size:14px;color:var(--muted);margin:8px 0 2px">En total ocupan ${mbT(o.total)} (incluye lo que se va guardando del mapa que ves).</p><button class="b2" style="color:#b3261e" onclick="if(confirm('¿Borrar todos los mapas guardados? Sin cobertura no se verá el mapa hasta volver a guardarlo.')){Nativo.borrarTodo();capas();toast('Mapas borrados')}">🗑 Borrar todos los mapas</button>`}
function borraZ(id){if(!confirm("¿Borrar este mapa guardado?"))return;Nativo.borrarZona(id);capas();toast("Mapa borrado")}
function capas(){$("sh").innerHTML=`<h2>🗺 Mapa</h2>`+Object.entries(CAPAS).map(([k,c])=>`<button class="capa" aria-pressed="${k===CAPA}" onclick="ponCapa('${k}')"><span>${k===CAPA?"✓":"○"}</span><span>${c.n}<small>${c.d}</small></span></button>`).join("")+
  (T.length?`<button class="b2 go" onclick="cierra();bajarZona()">⬇ Guardar la zona del track, para sin cobertura</button>`:"")+`<button class="b2 ${T.length?"":"go"}" onclick="cierra();bajarVista()">⬇ Guardar lo que se ve, para sin cobertura</button><p style="font-size:14px;color:#5d6b62;margin:4px 0 8px">Se guarda el mapa elegido de la zona que tienes en pantalla, con más detalle. Para preparar desde casa otra zona: en el mapa de la app, Capas › «Mapa de una zona para grabar sin cobertura».</p>${guardados()}<button class="b2" onclick="cierra()">Cerrar</button><p style="font-size:12px;color:#8a958e;text-align:center;margin:6px 0 0">Versión ${(()=>{try{return Nativo.version()}catch(e){return"?"}})()}</p>`;$("sheet").hidden=false}
const segB=L.polyline([],{color:"#fff",weight:9,opacity:.85}).addTo(map),segL=L.polyline([],{color:"#7b2cbf",weight:5,opacity:.95,dashArray:"10 7"}).addTo(map);
const lineB=L.polyline([],{color:"#fff",weight:8,opacity:.9}).addTo(map),line=L.polyline([],{color:"#c3262e",weight:5}).addTo(map);
let me=null,acc=null;const WPL=L.layerGroup().addTo(map);
function centrar(){SIGUE=true;clearTimeout(VUELTA);if(YO)map.setView([YO[0],YO[1]],Math.max(map.getZoom(),15));else toast("Buscando dónde estás…")}
// el mapa te sigue solo; si lo mueves con el dedo, vuelve a ti a los 20 s sin tocarlo (o al tocar ◎)
let VUELTA=null;map.on("dragstart zoomstart",e=>{if(e.type==="zoomstart"&&SIGUE)return;SIGUE=false;clearTimeout(VUELTA)});
map.on("dragend",()=>{clearTimeout(VUELTA);VUELTA=setTimeout(()=>{SIGUE=true;if(YO)map.panTo([YO[0],YO[1]])},20000)});
function toast(t,ms){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,ms||3500)}
// posición en directo (la manda Android, con el GPS del móvil)
function pos(la,lo,ac,al){YO=[la,lo,al];
  if(!me)me=L.marker([la,lo],{icon:L.divIcon({className:"me",html:"<i></i>",iconSize:[0,0]}),zIndexOffset:1000,interactive:false}).addTo(map);else me.setLatLng([la,lo]);
  if(ac>25&&ac<3000){if(!acc)acc=L.circle([la,lo],{radius:ac,color:"#1a73e8",weight:1,fillOpacity:.1,interactive:false}).addTo(map);else{acc.setLatLng([la,lo]);acc.setRadius(ac)}}else if(acc){acc.remove();acc=null}
  if(PRIM){PRIM=false;if(!T.length)map.setView([la,lo],15)}else if(SIGUE)map.panTo([la,lo],{animate:true});
  sigueA(la,lo)}
function sinPermiso(){toast("⛔ Sin permiso de ubicación. Ábrelo en Ajustes › Aplicaciones › Los de las Claras › Permisos › Ubicación.",8000)}
/* ---------- seguir un track ---------- */
let T=[],TC=[],UPC=[],DNC=[],TN="",FUERA=0,AVISADO=false,IDX=0,REV=false,SEGOPEN=false,SEGD=null,T0=[];
const lsG=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsS=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
function cargaSeguir(){let o=null;try{o=JSON.parse(Nativo.seguir()||"null")}catch(e){}
  if(!o||!o.t||o.t.length<2){T=[];segL.setLatLngs([]);segB.setLatLngs([]);$("seg").hidden=true;return}
  const nuevo=TN!==(o.n||"Track")||T0.length!==o.t.length;T0=o.t;TN=o.n||"Track";
  REV=lsG("rev:"+TN)==="1";prepara();
  const ll=T.map(p=>[p[0],p[1]]);segL.setLatLngs(ll);segB.setLatLngs(ll);
  if(nuevo){IDX=0;map.fitBounds(L.latLngBounds(ll),{padding:[40,40],paddingTopLeft:[20,150],paddingBottomRight:[80,150]});SIGUE=false;clearTimeout(VUELTA);VUELTA=setTimeout(()=>{SIGUE=true;if(YO)map.panTo([YO[0],YO[1]])},20000);setTimeout(ofreceZona,700)}
  pintaSeg(null)}
// distancias, subida y bajada acumuladas a lo largo del track (con 4 m de margen para el ruido, como en la app)
function prepara(){T=REV?T0.slice().reverse():T0.slice();const n=T.length;TC=[0];UPC=[0];DNC=[0];let U=0,Dn=0,ref=T[0][2];
  for(let i=1;i<n;i++){TC.push(TC[i-1]+dm(T[i-1],T[i]));const e=T[i][2];
    if(e!=null&&ref!=null){if(e-ref>=4){U+=e-ref;ref=e}else if(ref-e>=4){Dn+=ref-e;ref=e}}else if(ref==null)ref=e;UPC.push(U);DNC.push(Dn)}}
const fmM=m=>Math.round(m).toLocaleString("es-ES")+" m";
function pintaSeg(d){if(d!==undefined)SEGD=d;d=SEGD;const e=$("seg");if(!T.length){e.hidden=true;return}e.hidden=false;
  const n=T.length,tot=TC[n-1],hecho=TC[IDX]||0,queda=tot-hecho,upQ=UPC[n-1]-UPC[IDX],dnQ=DNC[n-1]-DNC[IDX],lejos=d!=null&&d>1000,fuera=!lejos&&d!=null&&d>60,fin=!lejos&&!fuera&&queda<60&&hecho>tot*.5;
  e.className="chip"+(fuera?" fuera":fin?" fin":"");
  const a=YO?dm(YO,T[0]):d;
  $("segTx").innerHTML=lejos?`▶ ${esc(TN)} · a <b>${kmT(a)} km</b> de la salida`:fuera?`⚠️ Te has salido del track (a ${Math.round(d)} m)`:fin?`🏁 ¡Has llegado al final!`:
    `▶ ${esc(TN)} · faltan <b>${kmT(queda)} km</b>${upQ>=10?` · +${fmM(upQ)}`:""}`;
  $("segIc").textContent=SEGOPEN?"▴":"▾";
  const m=$("segMas");m.hidden=!SEGOPEN;if(!SEGOPEN)return;
  m.innerHTML=`<div style="margin-bottom:4px">${esc(TN)}${REV?" <small>(al revés)</small>":""}</div><div class="bar"><i style="width:${tot?(hecho/tot*100).toFixed(1):0}%"></i></div>
   <div class="g3"><div><b>${kmT(hecho)}</b><small>km hechos</small></div><div><b>${kmT(queda)}</b><small>km que faltan</small></div><div><b>${kmT(tot)}</b><small>km en total</small></div>
   <div><b>+${fmM(UPC[IDX]||0)}</b><small>subida hecha</small></div><div><b>+${fmM(upQ)}</b><small>subida que falta</small></div><div><b>−${fmM(dnQ)}</b><small>bajada que falta</small></div></div>
   <div class="ir">${lejos||IDX<3?`<button onclick="llegar()">🚗 Cómo llegar a la salida</button>`:""}<button class="b" onclick="alReves()">⇄ Al revés</button><button class="b" onclick="verTrack()">🗺 Ver el track</button><button class="x" onclick="dejar()">✕ Dejar de seguir</button></div>
   <p style="font-size:13px;margin:8px 0 0;opacity:.8">Según el track. «Al revés» si lo empiezas por el final.</p>`}
function abreSeg(){SEGOPEN=!SEGOPEN;pintaSeg()}
function alReves(){REV=!REV;lsS("rev:"+TN,REV?"1":null);prepara();IDX=0;FUERA=0;AVISADO=false;if(YO)sigueA(YO[0],YO[1]);else pintaSeg();toast(REV?"Track al revés: empiezas por el final":"Track en el sentido normal")}
function sigueA(la,lo){if(!T.length)return;
  // el punto del track más cercano (buscando primero cerca del anterior)
  let best=-1,bd=1e12;const p=[la,lo];
  const a=Math.max(0,IDX-60),b=Math.min(T.length,IDX+400);for(let i=a;i<b;i++){const d=dm(p,T[i]);if(d<bd){bd=d;best=i}}
  if(bd>300)for(let i=0;i<T.length;i++){const d=dm(p,T[i]);if(d<bd){bd=d;best=i}}
  IDX=best;if(bd>60&&bd<=1000){FUERA++;if(FUERA>=2&&!AVISADO){AVISADO=true;try{Nativo.vibrar()}catch(e){}}}else{FUERA=0;AVISADO=false}
  pintaSeg(bd)}
function llegar(){const q=T[0];Nativo.abrir(`https://www.google.com/maps/dir/?api=1&destination=${q[0]},${q[1]}&travelmode=driving`)}
function verTrack(){SIGUE=false;clearTimeout(VUELTA);map.fitBounds(L.latLngBounds(T.map(p=>[p[0],p[1]])),{paddingTopLeft:[20,190],paddingBottomRight:[70,110]})}
function dejar(){Nativo.dejarSeguir();cargaSeguir();toast("Has dejado de seguir el track")}
// mapa sin cobertura: se bajan los trozos del mapa a lo largo del track (zoom 11 a 16)
function listaZona(){const L0=[];const vis=new Set();
  const tl=(la,lo,z)=>{const n=2**z,x=Math.floor((lo+180)/360*n),r=la*toR,y=Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n);return[x,y]};
  for(let z=11;z<=16;z++){const ring=z<=15?1:1;let prev=null;
    for(const q of T){const[x,y]=tl(q[0],q[1],z);const k=x+"/"+y;if(k===prev)continue;prev=k;
      for(let dx=-ring;dx<=ring;dx++)for(let dy=-ring;dy<=ring;dy++){const kk=CAPA+"/"+z+"/"+(x+dx)+"/"+(y+dy);if(!vis.has(kk)){vis.add(kk);L0.push(kk)}}}}
  if(L0.length>4000)L0.length=4000;return L0}
function bajarZona(){if(T.length)try{Nativo.bajar(JSON.stringify(listaZona()),TN)}catch(e){}}
const MB=(n,k)=>Math.max(1,Math.round(n*(k==="topo"?.018:k==="orto"?.035:.03)));
// al empezar a seguir: ¿guardar el mapa de la zona del track? (si ya está guardado, no se pregunta)
function ofreceZona(){if(!T.length||ZR)return;   // si se está ofreciendo una zona elegida en la app, no se pisa
 let f=0;try{f=+Nativo.faltan(JSON.stringify(listaZona()))}catch(e){}if(!f)return;
  $("sh").innerHTML=`<h2>🗺 ¿Guardar el mapa de la zona?</h2><p style="margin:0 0 6px">Para verlo aunque no haya cobertura en el monte. Elige el mapa:</p>`+
    Object.entries(CAPAS).map(([k,c])=>`<button class="capa" aria-pressed="${k===CAPA}" onclick="CAPA!=='${k}'&&ponCapaSin('${k}');ofreceZona()"><span>${k===CAPA?"✓":"○"}</span><span>${c.n}<small>${c.d}</small></span></button>`).join("")+
    `<button class="b2 go" onclick="cierra();bajarZona()">⬇ Guardar (unos ${MB(f,CAPA)} MB)</button><button class="b2" onclick="cierra()">Ahora no</button>
    <p style="font-size:14px;color:#5d6b62;margin:4px 0">Mejor con wifi. Luego también se puede desde 🗺.</p>`;$("sheet").hidden=false}
function ponCapaSin(k){CAPA=k;try{localStorage.setItem("capa",k)}catch(e){}FONDO.remove();FONDO=vigila(CAPAS[k].l()).addTo(map);FONDO.bringToBack()}
// zona elegida en el mapa de la app (Capas › Mapa de una zona para grabar sin cobertura): se enseña y se pregunta
let ZR=null;
function miraZona(){let o=null;try{o=JSON.parse(Nativo.zona()||"null")}catch(e){}if(!o||!o.z)return;const v=o.z.split(",").map(Number);
  const bb=L.latLngBounds([v[0],v[1]],[v[2],v[3]]);SIGUE=false;clearTimeout(VUELTA);map.fitBounds(bb);
  if(ZR)ZR.remove();ZR=L.rectangle(bb,{color:"#2a7a3b",weight:3,fill:false,dashArray:"8 6",interactive:false}).addTo(map);ofreceVista(bb,o.n)}
function listaVista(b){const z0=Math.max(8,Math.min(15,Math.round(map.getBoundsZoom(b)))),L0=[];
  const tl=(la,lo,z)=>{const n=2**z,x=Math.floor((lo+180)/360*n),r=la*toR,y=Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n);return[x,y]};
  for(let z=z0;z<=Math.min(16,z0+3);z++){const[x1,y1]=tl(b.getNorth(),b.getWest(),z),[x2,y2]=tl(b.getSouth(),b.getEast(),z);
    for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)L0.push(CAPA+"/"+z+"/"+x+"/"+y);if(L0.length>3000)break}
  if(L0.length>3000)L0.length=3000;return L0}
let ZN="Zona";function ofreceVista(bb,nm){ZN=nm||"Zona";let f=0;try{f=+Nativo.faltan(JSON.stringify(listaVista(bb)))}catch(e){}
  $("sh").innerHTML=`<h2>🗺 Mapa de ${esc(nm||"la zona")}</h2><p style="margin:0 0 6px">${f?"Para verlo aquí aunque no haya cobertura. Elige el mapa:":"Esta zona ya está guardada con este mapa. Puedes guardar también otro:"}</p>`+
    Object.entries(CAPAS).map(([k,c])=>`<button class="capa" aria-pressed="${k===CAPA}" onclick="CAPA!=='${k}'&&ponCapaSin('${k}');ofreceVista(ZR.getBounds(),'${esc(nm||"la zona").replace(/'/g,"")}')"><span>${k===CAPA?"✓":"○"}</span><span>${c.n}<small>${c.d}</small></span></button>`).join("")+
    (f?`<button class="b2 go" onclick="cierra();try{Nativo.bajar(JSON.stringify(listaVista(ZR.getBounds())),ZN)}catch(e){}">⬇ Guardar (unos ${MB(f,CAPA)} MB)</button>`:"")+`<button class="b2" onclick="cierra()">${f?"Ahora no":"Cerrar"}</button>
    <p style="font-size:14px;color:#5d6b62;margin:4px 0">Mejor con wifi. El recuadro verde es la zona que se guarda.</p>`;$("sheet").hidden=false}
function bajarVista(){const b=map.getBounds(),z0=Math.max(8,Math.min(15,Math.round(map.getZoom()))),L0=[];
  const tl=(la,lo,z)=>{const n=2**z,x=Math.floor((lo+180)/360*n),r=la*toR,y=Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n);return[x,y]};
  for(let z=z0;z<=Math.min(16,z0+3);z++){const[x1,y1]=tl(b.getNorth(),b.getWest(),z),[x2,y2]=tl(b.getSouth(),b.getEast(),z);
    for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)L0.push(CAPA+"/"+z+"/"+x+"/"+y);if(L0.length>3000)break}
  if(L0.length>3000){L0.length=3000;toast("Zona muy grande: acerca un poco el mapa para guardarla entera",5000)}
  try{Nativo.bajar(JSON.stringify(L0),"Zona vista el "+new Date().toLocaleDateString("es-ES",{day:"numeric",month:"short"}))}catch(e){}}
function bajando(h,t,falta){if(falta&&h<t)toast(`🗺 Guardando el mapa de la zona para sin cobertura: ${h} de ${t}`,2500);else if(h>=t)toast(falta?"🗺 Mapa de la zona guardado: se verá sin cobertura":"🗺 El mapa de la zona ya estaba guardado",3000)}
function sinRed(){toast("Sin cobertura: el mapa de la zona no se ha podido guardar. Se verán las partes que ya hayas visto.",5000)}
/* ---------- puntos ---------- */
function nuevoPunto(){if(!YO){toast("Todavía no sé dónde estás: espera a que salga el punto azul");return}
  const n=+(Nativo.nPuntos()||0)+1;
  $("sh").innerHTML=`<h2>📍 Guardar un punto aquí</h2><label>Nombre</label><input id="pn" maxlength="80" value="Punto ${n}">
  <button class="b2 go" onclick="guardaPunto()">✓ Guardar punto</button><button class="b2" onclick="cierra()">Cancelar</button>
  <p style="font-size:14px;color:#5d6b62">Pasa a tu app, en <b>Mis cosas › Puntos</b>${S.activo?", y va también dentro del GPX del recorrido":""}.</p>`;
  $("sheet").hidden=false;setTimeout(()=>{const i=$("pn");i.focus();i.select()},50)}
function guardaPunto(){const n=($("pn").value||"").trim()||"Punto";Nativo.punto(n,YO[0],YO[1],YO[2]==null?NaN:YO[2]);cierra();pintaPuntos();toast("📍 «"+n+"» guardado")}
function pintaPuntos(){WPL.clearLayers();let l=[];try{l=JSON.parse(Nativo.listaPuntos()||"[]")}catch(e){}
  for(const w of l)WPL.addLayer(L.marker([w[1],w[2]],{icon:L.divIcon({className:"wp",html:"<i></i>",iconSize:[0,0]})}).bindTooltip(esc(w[0]),{direction:"top",offset:[0,-28]}))}
/* ---------- grabar ---------- */
function sube(){let up=0,ref=null;for(const p of PTS){if(p[2]==null)continue;if(ref==null){ref=p[2];continue}if(p[2]-ref>5){up+=p[2]-ref;ref=p[2]}else if(ref-p[2]>5)ref=p[2]}return Math.round(up)}
const dur=()=>S.activo?Math.max(0,(S.pz||Date.now())-S.t0-S.pau):0;
function baja(){let dn=0,ref=null;for(const p of PTS){if(p[2]==null)continue;if(ref==null){ref=p[2];continue}if(ref-p[2]>5){dn+=ref-p[2];ref=p[2]}else if(p[2]-ref>5)ref=p[2]}return Math.round(dn)}
// tiempo en movimiento: tramos entre puntos a más de 0,4 m/s (y menos de 15, para no contar saltos del GPS)
function mov(){let t=0,d=0;for(let i=1;i<PTS.length;i++){const a=PTS[i-1],b=PTS[i],dt=(b[3]-a[3])/1000;if(!(dt>0)||dt>600)continue;const dd=dm(a,b),v=dd/dt;if(v>.4&&v<15){t+=dt;d+=dd}}return{t:t*1000,d}}
let DATOS=false;
function datos(){if(!S.activo){toast(T.length?"Toca ● (abajo) para grabar mientras sigues el track":"Toca ● (abajo) para empezar a grabar");return}DATOS=true;$("sh").dataset.d="1";$("sheet").hidden=false;pintaDatos()}
function pintaDatos(){if(!DATOS)return;if($("sheet").hidden||($("sh").innerHTML&&!$("sh").querySelector(".dt")&&$("sh").dataset.d!=="1")){DATOS=false;return}$("sh").dataset.d="";
  const tt=dur(),m=mov(),np=+(Nativo.nPuntos()||0),vm=m.t?m.d/(m.t/1000)*3.6:0,ritmo=vm?60/vm:0,ini=new Date(S.t0);
  const fila=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`;
  $("sh").innerHTML=`<h2>📊 ${S.pz?"❚❚ En pausa":"● Grabando"}</h2><p style="margin:0 0 6px;color:#5d6b62;font-size:15px">${PTS.length?"Puedes apagar la pantalla: sigue grabando.":"Esperando la señal del GPS…"}</p>
  <table class="dt">${fila("⏱ Tiempo total",hms(tt))}${fila("🚶 En movimiento",hms(m.t))}${fila("☕ Parado",hms(Math.max(0,tt-m.t)))}${S.pau||S.pz?fila("❚❚ En pausa",hms(S.pau+(S.pz?Date.now()-S.pz:0))):""}
  ${fila("📏 Distancia",kmT(D)+" km")}${fila("↗ Subida",fmM(sube()))}${fila("↘ Bajada",fmM(baja()))}
  ${fila("🏃 Velocidad media (en movimiento)",vm?vm.toLocaleString("es-ES",{maximumFractionDigits:1})+" km/h":"—")}${fila("⏳ Ritmo",ritmo&&ritmo<120?(x=>Math.floor(x/60)+":"+String(x%60).padStart(2,"0"))(Math.round(ritmo*60))+" min/km":"—")}
  ${fila("🕘 Empezaste",ini.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}))}${fila("📍 Puntos guardados",np)}${fila("🛰 Puntos de GPS",PTS.length.toLocaleString("es-ES"))}</table>
  <p style="font-size:13px;color:#8a958e;margin:0 0 6px">La subida y la bajada salen de la altura del GPS: son aproximadas.</p>
  <button class="b2" onclick="cierra()">Cerrar</button>`}
function pinta(){
  const e=$("rec");
  if(!S.activo){e.className="chip";$("recTx").textContent=T.length?"Toca ● para grabar mientras lo sigues":"Toca ● para grabar";$("recIc").hidden=true}
  else{$("recIc").hidden=false;e.className="chip "+(S.pz?"pau":"rec");
    $("recTx").innerHTML=(S.pz?"❚❚ ":`<i class="dot"></i>`)+`${hms(dur())} · ${kmT(D)} km · +${sube().toLocaleString("es-ES")} m`}
  pintaDatos();
  $("abajo").innerHTML=!S.activo?`<button class="big go" onclick="Nativo.empezar()" aria-label="Grabar"><i></i></button>`:
    `<button class="big ${S.pz?"pl":"ps"}" onclick="Nativo.pausa()" aria-label="${S.pz?"Seguir grabando":"Pausa"}"><i></i></button><button class="big fn" onclick="fin()" aria-label="Terminar"><i></i></button>`;
  $("b-bat").hidden=!S.activo||Nativo.sinBateria()}
function nuevos(){const n=JSON.parse(Nativo.puntos(PTS.length));for(const p of n){if(PTS.length)D+=dm(PTS[PTS.length-1],p);PTS.push(p)}
  if(n.length){const ll=PTS.map(p=>[p[0],p[1]]);line.setLatLngs(ll);lineB.setLatLngs(ll)}}
function refresca(){S=JSON.parse(Nativo.estado());if(!S.activo){PTS=[];D=0;line.setLatLngs([]);lineB.setLatLngs([])}nuevos();pinta();pintaPuntos()}
function fin(){const d=new Date(S.t0),np=+(Nativo.nPuntos()||0);
  $("sh").innerHTML=`<h2>■ Terminar la grabación</h2><p><b>${hms(dur())}</b> · <b>${kmT(D)} km</b> · <b>+${sube()} m</b>${np?` · <b>${np}</b> punto${np>1?"s":""}`:""}</p>
  <label>Nombre</label><input id="nm" maxlength="80" value="Recorrido del ${d.toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"})}">
  <button class="b2 go" onclick="Nativo.terminar(document.getElementById('nm').value.trim()||'Recorrido grabado')">✓ Terminar y guardar</button>
  <button class="b2" onclick="cierra()">● Seguir grabando</button>
  <button class="b2" style="color:#b3261e" onclick="if(confirm('¿Tirar lo grabado? No se puede recuperar.')){cierra();Nativo.tirar()}">🗑 Tirar la grabación</button>`;
  $("sheet").hidden=false}
function hecho(n,donde,est){const e=esc(n);
  const msg=est==="ok"?`<p style="font-size:17px">✅ <b>Ya está en tu app</b>, en <b>Mis cosas › Tracks</b>.</p>`:
    est==="enviando"?`<p style="font-size:17px">⏳ Pasándolo a tu app…</p>`:
    est==="pendiente"?`<p style="font-size:17px">📶 <b>Sin cobertura</b>: pasará a tu app en cuanto haya conexión (vuelve a abrir esta pantalla con cobertura).</p>`:
    `<p style="font-size:16px">Para tenerlo en Mis tracks: en la app ve a <b>Mis cosas › Tracks › ⬆️ Cargar GPX/KML</b> y elige el archivo en <b>Descargas › Los de las Claras</b>.</p>`;
  $("sh").innerHTML=`<h2>✓ ${e}</h2>${msg}
  <button class="b2 go" onclick="Nativo.compartir()">📄 Enviar el archivo GPX (WhatsApp, Wikiloc…)</button>
  <button class="b2" onclick="cierra();Nativo.volver()">🏠 Volver a la app</button>
  <button class="b2" onclick="cierra()">Cerrar</button>
  <p style="font-size:14px;color:#5d6b62">Copia en ${esc(donde)}.</p>`;$("sheet").hidden=false;refresca()}
function aviso(t){toast(t,6000)}
function cierra(){$("sheet").hidden=true;DATOS=false}
cargaSeguir();refresca();setTimeout(miraZona,300);
setInterval(()=>{if(document.visibilityState!=="visible")return;S=JSON.parse(Nativo.estado());nuevos();pinta()},2000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){refresca();cargaSeguir()}});
</script></body></html>
